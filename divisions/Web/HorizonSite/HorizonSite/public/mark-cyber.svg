<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- SINGULARITÉ — Cybersécurité — Orange précision -->
  <defs>
    <linearGradient id="sg-cyber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD65C"/>
      <stop offset="60%" stop-color="#FF7A1A"/>
      <stop offset="100%" stop-color="#CC3300"/>
    </linearGradient>
  </defs>

  <!-- Single precise 300° arc — gap at bottom-right (precision, watchful) -->
  <!-- Circumference = 2π*39 ≈ 245. 300° = 204, gap 60° = 41 -->
  <circle
    cx="50" cy="50" r="39"
    fill="none"
    stroke="url(#sg-cyber)"
    stroke-width="8"
    stroke-linecap="round"
    stroke-dasharray="204 41"
    transform="rotate(120 50 50)"
  />

  <!-- Center black -->
  <circle cx="50" cy="50" r="13" fill="#000000"/>
  <!-- Gold singularity dot -->
  <circle cx="50" cy="50" r="4" fill="#FFD65C"/>
</svg>
