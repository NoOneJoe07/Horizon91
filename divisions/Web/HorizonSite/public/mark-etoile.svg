<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- L'ÉTOILE — Groupe Étoile Boréale — Polaris Techno — fond transparent -->
  <defs>
    <radialGradient id="rg-star" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="15%" stop-color="#FFD65C"/>
      <stop offset="50%" stop-color="#FF7A1A"/>
      <stop offset="100%" stop-color="#8B2200" stop-opacity="0.3"/>
    </radialGradient>
  </defs>

  <!-- Outer compass ring — les pointes cardinales touchent ce cercle (r=47) -->
  <circle cx="50" cy="50" r="47" fill="none" stroke="#FF7A1A" stroke-width="0.6" opacity="0.5"/>

  <!-- Mid precision ring -->
  <circle cx="50" cy="50" r="28" fill="none" stroke="#FFD65C" stroke-width="0.4" opacity="0.28"/>

  <!-- 8-pointed Polaris star — cardinaux r=47, diagonaux r=30, concaves r=12 -->
  <polygon
    points="50,3 54.6,38.9 71.2,28.8 61.1,45.4 97,50 61.1,54.6 71.2,71.2 54.6,61.1 50,97 45.4,61.1 28.8,71.2 38.9,54.6 3,50 38.9,45.4 28.8,28.8 45.4,38.9"
    fill="url(#rg-star)"
  />

  <!-- Inner precision ring -->
  <circle cx="50" cy="50" r="10" fill="none" stroke="#FFD65C" stroke-width="0.6" opacity="0.55"/>

  <!-- Circuit nodes — pointes cardinales (sur le cercle) -->
  <circle cx="50" cy="3" r="2" fill="#FFD65C"/>
  <circle cx="97" cy="50" r="2" fill="#FFD65C"/>
  <circle cx="50" cy="97" r="2" fill="#FFD65C"/>
  <circle cx="3" cy="50" r="2" fill="#FFD65C"/>

  <!-- Circuit nodes — pointes diagonales -->
  <circle cx="71.2" cy="28.8" r="1.3" fill="#FF7A1A" opacity="0.8"/>
  <circle cx="71.2" cy="71.2" r="1.3" fill="#FF7A1A" opacity="0.8"/>
  <circle cx="28.8" cy="71.2" r="1.3" fill="#FF7A1A" opacity="0.8"/>
  <circle cx="28.8" cy="28.8" r="1.3" fill="#FF7A1A" opacity="0.8"/>

  <!-- White hot stellar core -->
  <circle cx="50" cy="50" r="4.5" fill="#FFFFFF"/>
  <!-- Gold singularity ring -->
  <circle cx="50" cy="50" r="7" fill="none" stroke="#FFD65C" stroke-width="1.2"/>
</svg>
