<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Groupe Étoile Boréale">

  <!-- Anneau extérieur -->
  <circle cx="50" cy="50" r="44" fill="none" stroke="white" stroke-width="2.5"/>

  <!-- Points cardinaux sur l'anneau extérieur — N E S O -->
  <circle cx="50"   cy="6"  r="3.5" fill="white"/>
  <circle cx="94"   cy="50" r="3.5" fill="white"/>
  <circle cx="50"   cy="94" r="3.5" fill="white"/>
  <circle cx="6"    cy="50" r="3.5" fill="white"/>

  <!-- Anneau intérieur — visible dans les concavités entre les pointes -->
  <circle cx="50" cy="50" r="26" fill="none" stroke="white" stroke-width="1.5" opacity="0.45"/>

  <!-- Rose des vents — étoile 4 pointes à côtés CONCAVES (courbes bezier)    -->
  <!-- Pointes : N(50,9)  E(83,50)  S(50,91)  O(17,50)  — N-S légèrement allongé -->
  <!-- Points de contrôle quadratique tirés vers le centre pour la concavité    -->
  <path d="M50,9 Q54,46 83,50 Q54,54 50,91 Q46,54 17,50 Q46,46 50,9 Z"
        fill="white"/>

  <!-- Centre — disque Bleu Nuit + point blanc -->
  <circle cx="50" cy="50" r="8"   fill="#203478"/>
  <circle cx="50" cy="50" r="3.5" fill="white"/>

</svg>
