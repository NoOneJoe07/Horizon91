<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- SINGULARITÉ — Cybersécurité — Bleu Nuit Boréal #203478 -->
  <defs>
    <linearGradient id="sg-cyber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A67C8"/>
      <stop offset="60%" stop-color="#203478"/>
      <stop offset="100%" stop-color="#152260"/>
    </linearGradient>
  </defs>

  <!-- Single precise 300° arc — gap at bottom-right (precision, watchful) -->
  <circle
    cx="50" cy="50" r="39"
    fill="none"
    stroke="url(#sg-cyber)"
    stroke-width="8"
    stroke-linecap="round"
    stroke-dasharray="204 41"
    transform="rotate(120 50 50)"
  />

  <!-- Center dark -->
  <circle cx="50" cy="50" r="13" fill="#152260"/>
  <!-- Night blue singularity dot -->
  <circle cx="50" cy="50" r="4" fill="#4A67C8"/>
</svg>
