<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Division Draveur — Développement Web">
  <!-- LA FLAMME — Division Draveur — Bleu Polaire #0099D1 -->
  <defs>
    <linearGradient id="sg-web-v2" gradientUnits="userSpaceOnUse" x1="50" y1="12" x2="88" y2="88">
      <stop offset="0%"   stop-color="#B8E8F7"/>
      <stop offset="40%"  stop-color="#0099D1"/>
      <stop offset="100%" stop-color="#203478"/>
    </linearGradient>
  </defs>

  <!-- Arc asymétrique 300° — La Flamme qui maîtrise le courant -->
  <circle
    cx="50" cy="50" r="38"
    fill="none"
    stroke="url(#sg-web-v2)"
    stroke-width="10"
    stroke-linecap="round"
    stroke-dasharray="199 40"
    transform="rotate(-90 50 50)"
  />

  <!-- Centre Space Black + point Bleu Polaire -->
  <circle cx="50" cy="50" r="12" fill="#1D1D1B"/>
  <circle cx="50" cy="50" r="3.5" fill="#0099D1"/>

  <!-- Point lumineux à l'origine de l'arc (étoile filante) -->
  <circle cx="50" cy="12" r="3" fill="#B8E8F7" opacity="0.80"/>
</svg>
