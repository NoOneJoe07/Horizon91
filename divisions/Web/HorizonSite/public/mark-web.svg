<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- LA FLAMME — Développement Web — Violet warp vers orange -->
  <defs>
    <linearGradient id="sg-web" gradientUnits="userSpaceOnUse" x1="50" y1="12" x2="88" y2="88">
      <stop offset="0%" stop-color="#FFD65C" stop-opacity="0.25"/>
      <stop offset="35%" stop-color="#6A00FF"/>
      <stop offset="75%" stop-color="#9B30FF"/>
      <stop offset="100%" stop-color="#FF7A1A"/>
    </linearGradient>
  </defs>

  <!-- Asymmetric 300° arc — thick, tapering start, bright end -->
  <!-- Circumference = 2π*38 ≈ 239. 300° = 199, gap 60° = 40 -->
  <circle
    cx="50" cy="50" r="38"
    fill="none"
    stroke="url(#sg-web)"
    stroke-width="10"
    stroke-linecap="round"
    stroke-dasharray="199 40"
    transform="rotate(-90 50 50)"
  />

  <!-- Center black -->
  <circle cx="50" cy="50" r="12" fill="#000000"/>
  <!-- Gold dot -->
  <circle cx="50" cy="50" r="3.5" fill="#FFD65C"/>

  <!-- Star dot at arc origin (top = the dying star) -->
  <circle cx="50" cy="12" r="3" fill="#FFD65C" opacity="0.75"/>
</svg>
