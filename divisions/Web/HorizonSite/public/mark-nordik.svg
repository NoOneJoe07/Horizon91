<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- VORTEX — Studio Nordik Legion — Cyan ion -->

  <!-- Outer ring: 280° arc, gap at bottom-right -->
  <circle
    cx="50" cy="50" r="43"
    fill="none"
    stroke="#00F0FF"
    stroke-width="3.5"
    stroke-linecap="round"
    stroke-dasharray="210 60"
    transform="rotate(-120 50 50)"
    opacity="0.50"
  />

  <!-- Middle ring: 280° arc, slightly rotated -->
  <circle
    cx="50" cy="50" r="31"
    fill="none"
    stroke="#00F0FF"
    stroke-width="4"
    stroke-linecap="round"
    stroke-dasharray="151 43"
    transform="rotate(-80 50 50)"
    opacity="0.75"
  />

  <!-- Inner ring: 280° arc -->
  <circle
    cx="50" cy="50" r="19"
    fill="none"
    stroke="#00F0FF"
    stroke-width="4.5"
    stroke-linecap="round"
    stroke-dasharray="92 27"
    transform="rotate(-40 50 50)"
  />

  <!-- Cyan core -->
  <circle cx="50" cy="50" r="5" fill="#00F0FF"/>
</svg>
